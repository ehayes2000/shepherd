[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
shepherd-core = { path = "crates/core" }
shepherd-tui = { path = "crates/tui" }
shepherd-term = { path = "crates/term" }
shepherd-adapters = { path = "crates/adapters" }
shepherd-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
base64 = "0.22"
ratatui = "0.30"
alacritty_terminal = { version = "0.26", default-features = false }
insta = "1"
portable-pty = "0.9"
libc = "0.2"
toml = "0.9"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
