[package]
name = "shepherd-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shepherd-core.workspace = true
portable-pty.workspace = true
libc.workspace = true
toml.workspace = true
serde_json.workspace = true
wait-timeout.workspace = true
tempfile.workspace = true
thiserror.workspace = true
serde.workspace = true
# The machine identity (T29) is an iroh secret key, so the endpoint (T30) binds with the same key. Features as in
# spike T28: no portmapper, no metrics.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
# The `Peers` adapter (T30, decision 0019): iroh runs on one current-thread tokio runtime of its own, pairing tickets
# are `iroh_tickets` (postcard + base32), and pairing tokens are compared in constant time.
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros"] }
iroh-tickets = "1.0.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
subtle = "2.6"

[dev-dependencies]
shepherd-testkit.workspace = true

[lints]
workspace = true
