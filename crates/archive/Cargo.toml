[package]
name = "shepherd-archive"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only fault injection (decision 0015): `BlobStore::put` exits the process between writing the temp file and
# renaming it, when the content starts with `CRASH_BEFORE_RENAME`. Inert for any other content.
fault-injection-crash-before-rename = []
# Test-only fault injection (decision 0015): `BlobStore::put` of content starting with `PAUSE_BEFORE_RENAME` writes
# `PAUSE_MARKER` to stdout once its temp file is written, then waits for a byte (or EOF) on stdin before renaming it, so
# a test can act while a live writer is mid-put. Inert for any other content.
fault-injection-pause-before-rename = []
# Test-only fault injection (decision 0015): a capture for the agent session `PAUSE_BEFORE_OPEN_SESSION` writes
# `PAUSE_BEFORE_OPEN_MARKER` to stdout after checking a transcript's path and before opening it, then waits for a byte
# (or EOF) on stdin, so a test can swap the file or a directory on its path in between. Inert for any other session.
fault-injection-pause-before-transcript-open = []
# Test-only fault injection (decision 0015): a restore of the agent session `PAUSE_BEFORE_PUBLISH_SESSION` writes
# `PAUSE_BEFORE_PUBLISH_MARKER` to stdout once its temp files are written and before it publishes any of them, then
# waits for a byte (or EOF) on stdin, so a test can change the target in between. Inert for any other session.
fault-injection-pause-before-restore-publish = []

[dependencies]
sha2.workspace = true
zstd.workspace = true
rusqlite.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
# Reading transcripts for an agent's reply (T47).
serde_json.workspace = true

[dev-dependencies]
# The crate's own tests turn the fault injection on; normal builds of anything that depends on it never do.
shepherd-archive = { path = ".", features = [
  "fault-injection-crash-before-rename",
  "fault-injection-pause-before-rename",
  "fault-injection-pause-before-transcript-open",
  "fault-injection-pause-before-restore-publish",
] }
tempfile.workspace = true
# Tests only: a child process sets a strict umask to prove created modes are exact.
libc.workspace = true

[lints]
workspace = true
