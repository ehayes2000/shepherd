[package]
name = "shepherd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shepherd-core.workspace = true
shepherd-tui.workspace = true
shepherd-term.workspace = true
shepherd-adapters.workspace = true
shepherd-archive.workspace = true
jiff.workspace = true
serde_json.workspace = true
ratatui.workspace = true
thiserror.workspace = true
ulid = "1.2"
# Pairing tokens (T30): 16 bytes of OS randomness.
getrandom = "0.3"
signal-hook = "0.3"
# Quoting `shepherd archive restore`'s resume lines for a shell (T43).
shlex = "2"
tracing = "0.1"
serde.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# `shepherd mcp` (T53, decision 0022): the official MCP Rust SDK, its tools' schemas, and the one current-thread tokio
# runtime it serves stdio on. `local`: tool calls run the CLI's (non-`Send`) client on that thread.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io", "local"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "io-std", "io-util"] }

[dev-dependencies]
shepherd-term = { workspace = true, features = ["panic-trigger"] }
shepherd-testkit.workspace = true
tempfile.workspace = true
portable-pty.workspace = true
toml.workspace = true
insta.workspace = true

[lints]
workspace = true

[[bin]]
name = "shepherd"
path = "src/main.rs"
