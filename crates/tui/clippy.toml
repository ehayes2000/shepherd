# shepherd-tui draws text only through `crate::draw`, whose functions take a `DisplayText` (F35): text from agents,
# hooks, git and other clients can't reach the screen without `display_safe`. See docs/architecture.md.
# Clippy does not merge config files, so the root settings are repeated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = false

disallowed-methods = [
  { path = "ratatui::buffer::Buffer::set_string", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Buffer::set_stringn", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Buffer::set_line", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Buffer::set_span", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Cell::set_symbol", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Cell::set_char", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Cell::merge_symbol", reason = "draw text with crate::draw::set, which takes a DisplayText" },
  { path = "ratatui::buffer::Cell::new", reason = "build cells only by drawing with crate::draw, whose text is a DisplayText" },
  { path = "ratatui::buffer::Buffer::filled", reason = "build cells only by drawing with crate::draw, whose text is a DisplayText" },
  # Tests may build a `Buffer::with_lines` to compare against; scripts/check-arch.sh keeps it out of non-test tui code,
  # since its cells could otherwise be moved into the frame (`*buf = other`, `mem::swap`, field moves).
  { path = "ratatui::buffer::Buffer::merge", reason = "build cells only by drawing with crate::draw, whose text is a DisplayText" },
  { path = "ratatui::buffer::Buffer::cell_mut", reason = "build cells only by drawing with crate::draw, whose text is a DisplayText" },
  { path = "ratatui::buffer::Buffer::get_mut", reason = "build cells only by drawing with crate::draw, whose text is a DisplayText" },
  { path = "ratatui::text::Span::raw", reason = "make spans with crate::draw::span, which takes a DisplayText" },
  { path = "ratatui::text::Span::styled", reason = "make spans with crate::draw::span, which takes a DisplayText" },
  { path = "ratatui::text::Line::raw", reason = "make lines with crate::draw::line, which takes a DisplayText" },
  { path = "ratatui::text::Line::styled", reason = "make lines with crate::draw::line, which takes a DisplayText" },
  { path = "ratatui::text::Text::raw", reason = "make lines with crate::draw::line, which takes a DisplayText" },
  { path = "ratatui::text::Text::styled", reason = "make lines with crate::draw::line, which takes a DisplayText" },
  { path = "ratatui::widgets::Paragraph::new", reason = "use crate::draw::paragraph, whose lines are DisplayText" },
  { path = "ratatui::widgets::Block::title", reason = "use crate::draw::titled, which takes a DisplayText" },
  { path = "ratatui::widgets::Block::title_top", reason = "use crate::draw::titled, which takes a DisplayText" },
  { path = "ratatui::widgets::Block::title_bottom", reason = "use crate::draw::titled, which takes a DisplayText" },
  { path = "ratatui::widgets::List::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::ListItem::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Table::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Row::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Cell::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Tabs::new", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::List::items", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Table::rows", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Table::header", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Table::footer", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Row::cells", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::widgets::Tabs::titles", reason = "add a DisplayText-only constructor to crate::draw" },
  { path = "ratatui::text::Line::push_span", reason = "make lines with crate::draw::spans, which takes DisplayText" },
  { path = "ratatui::text::Line::spans", reason = "make lines with crate::draw::spans, which takes DisplayText" },
  { path = "ratatui::text::Text::push_line", reason = "make lines with crate::draw::line, which takes a DisplayText" },
  { path = "ratatui::text::Text::push_span", reason = "make lines with crate::draw::spans, which takes DisplayText" },
  # `&str` and `String` are widgets: everything is drawn with crate::draw::render, which takes only its own widgets.
  { path = "ratatui::widgets::Widget::render", reason = "draw with crate::draw::render, which takes only crate::draw's widgets" },
  { path = "ratatui::widgets::StatefulWidget::render", reason = "draw with crate::draw::render, which takes only crate::draw's widgets" },
  { path = "ratatui::Frame::render_widget", reason = "draw with crate::draw::render, which takes only crate::draw's widgets" },
  { path = "ratatui::Frame::render_stateful_widget", reason = "draw with crate::draw::render, which takes only crate::draw's widgets" },
  # A border set or a shadow symbol is any `&'static str`.
  { path = "ratatui::widgets::Block::border_set", reason = "use Block::border_type, whose sets are ratatui's own" },
  { path = "ratatui::widgets::Block::shadow", reason = "a shadow's symbol is any &'static str; add a crate::draw helper if needed" },
]
# `Line::from`, `Text::from`, `Span::from`, `ListItem::from`, `Row::from` and `Cell::from` (widget and buffer cells) are
# trait methods clippy can't single out here, and `Buffer::content` and `buf[(x, y)] = cell` write cells directly:
# scripts/check-arch.sh greps non-test code for them instead. `.into()` isn't banned (it fires inside insta and
# serde_json macros in every test): a Line, Span or Text made with it has nowhere to go, since paragraphs take only
# crate::draw::ShownLine and crate::draw::render takes only crate::draw's widgets.
